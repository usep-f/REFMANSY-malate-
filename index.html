<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refmansy - Reference Management System</title>
    <meta http-equiv="refresh" content="2; url=login.html">
    <link rel="stylesheet" href="login.css">
    <style>
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .redirect-text {
            font-size: 15px;
            color: #94a3b8;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="loading-screen">
        <div class="spinner"></div>
        <h1 class="brand-title">Refmansy</h1>
        <p class="redirect-text">Loading application...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        (async function() {
            try {
                if (window.refmansyApi && window.refmansyApi.auth) {
                    const session = await window.refmansyApi.auth.getSession();
                    if (session && session.user) {
                        const userData = await window.refmansyApi.auth.getCurrentUser();
                        if (userData && userData.profile && userData.profile.status !== 'inactive') {
                            if (userData.profile.role === 'admin') {
                                window.location.replace('admin-dashboard.html');
                                return;
                            } else {
                                window.location.replace('faculty-dashboard.html');
                                return;
                            }
                        }
                    }
                }
            } catch (err) {
                console.warn('Redirecting to login fallback:', err);
            }
            window.location.replace('login.html');
        })();
    </script>
</body>
</html>
